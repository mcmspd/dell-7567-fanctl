# dell-fanctl staged-transient config for 7567/7577 Linux, shared heatpipe.
# Two-stage ramp (gentle, no flap): sustained kick/mid-level takes fans 0->1 only;
# 1->2 needs PROMOTE_SUSTAIN consecutive heavy polls; step-downs 2->1->0 need
# DOWN_SUSTAIN consecutive cool polls (never jumps 0->2 or cuts 2->0).
# CPU and GPU share one cooler: GPU trips 5C lower (GTX1050 heat soaks fast, stock keeps 65C gaming).
TEMP_LOW=58
TEMP_HIGH=70
TEMP_LOW_GPU=58
TEMP_HIGH_GPU=70
HYST_OFFSET=3
POLL_INTERVAL=2
DERIV_KICK=8
POWER_HIGH=45
POWER_DELTA=30
POWER_LOW=10
KICK_SUSTAIN=2
PROMOTE_SUSTAIN=3
DOWN_SUSTAIN=3
EMERG_HIGH=85
MAX_STATE=2
