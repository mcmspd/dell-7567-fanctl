# dell-fanctl fast-transient config for 7567/7577 Linux, shared heatpipe.
# Fixes BOTH slow climb (early kick) and slow spin-down (tight 3C hysteresis).
# CPU and GPU share one cooler: GPU trips 5C lower (GTX1050 heat soaks fast, stock keeps 65C gaming).
TEMP_LOW=58
TEMP_HIGH=70
TEMP_LOW_GPU=58
TEMP_HIGH_GPU=70
HYST_OFFSET=3
POLL_INTERVAL=2
DERIV_KICK=6
POWER_HIGH=40
POWER_DELTA=25
POWER_LOW=10
MAX_STATE=2
